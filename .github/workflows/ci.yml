name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # The fixture and track record tests run against a real Postgres
      # (inside a rolled-back transaction); they skip without one.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: epl
          POSTGRES_PASSWORD: epl
          POSTGRES_DB: epl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U epl -d epl"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://epl:epl@localhost:5432/epl
      # Tests use an in-memory Redis; the app only needs the setting to import.
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      # The database tests pair up existing teams, which the history loader
      # normally creates. Seed just the teams; no downloads.
      - name: Seed teams
        run: |
          python - <<'PY'
          import asyncio
          from app.db import engine
          from app.ingest import seed_teams

          async def main():
              async with engine.begin() as conn:
                  await seed_teams(conn)
              await engine.dispose()

          asyncio.run(main())
          PY
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
