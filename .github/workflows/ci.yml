# Runs on every pull request (so problems show up before merging) and on
# every push to main (so main itself is known to be green).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or PR cancels the run it makes out of date.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest, ruff, mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    # Throwaway Postgres and Redis for this run, the same major versions as
    # docker-compose.yml. The password is not a secret: the database only
    # exists for the length of the job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: epl
          POSTGRES_PASSWORD: epl
          POSTGRES_DB: epl
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U epl -d epl"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://epl:epl@localhost:5432/epl
      REDIS_URL: redis://localhost:6379/0
      # The Postgres tests fail instead of skipping if the database is unreachable.
      REQUIRE_POSTGRES: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply migrations
        run: alembic upgrade head

      # -rs lists every skipped test and why, e.g. the saved-model checks
      # (model files are git-ignored, so they skip here).
      - name: Tests
        run: pytest -rs

      - name: Lint
        run: ruff check --output-format github .

      - name: Formatting
        run: ruff format --check .

      - name: Type check
        run: mypy

  frontend:
    name: Frontend (typecheck, vitest, build, API types)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      # The drift check needs the backend's OpenAPI schema, which is exported
      # straight from the app: no server, database or Redis involved.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Export the backend's OpenAPI schema
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://unused@localhost/unused
          REDIS_URL: redis://localhost:6379/0
        run: |
          pip install -r requirements.txt
          python -m scripts.export_openapi > "$RUNNER_TEMP/openapi.json"

      - name: API types match the backend
        run: npm run check:api -- "$RUNNER_TEMP/openapi.json"
