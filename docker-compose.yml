services:
  postgres:
    image: postgres:16
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    # Redis only holds the API's response cache, so cap its memory and let it
    # evict the least recently used entries rather than refuse writes.
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      # Downloaded CSVs are cached here (backend/data/raw on the host, git-ignored).
      - ./backend/data:/app/data
      # Trained models are written here (backend/models on the host).
      - ./backend/models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # urlopen raises on a 503, so this fails whenever Postgres or Redis is unreachable.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    # Same image as the backend, different command: runs the scheduled jobs
    # (fixture refresh, history loader, saving predictions) in their own process.
    # See scripts/worker.py.
    build: ./backend
    command: ["python", "-m", "scripts.worker"]
    env_file: .env
    # A small init as PID 1, so `docker compose stop` (SIGTERM) stops the worker
    # at once instead of after the 10-second kill timeout.
    init: true
    restart: unless-stopped
    volumes:
      - ./backend/data:/app/data
      # Every tracked model (live and shadow) predicts before kickoff.
      - ./backend/models:/app/models
    depends_on:
      # The backend applies migrations on start; wait for it so the tables exist.
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
